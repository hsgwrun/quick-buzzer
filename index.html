<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>QUICK BUZZER</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Noto Sans JP", system-ui, sans-serif;
      background: #fff;
      color: #222;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #fff;
    }
    main {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 34px;
      padding: 24px;
      text-align: center;
    }
    .stage {
      display: grid;
      place-items: center;
      min-height: min(58vh, 440px);
      width: 100%;
    }
    .mark {
      color: #e60033;
      font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
      font-size: clamp(220px, 48vw, 440px);
      font-weight: 400;
      line-height: 1;
      opacity: 0;
      transform: scale(.92);
      transition: opacity .12s ease, transform .16s ease;
      user-select: none;
    }
    .mark.active {
      opacity: 1;
      transform: scale(1);
    }
    .hint {
      min-height: 1.5em;
      color: #777;
      font-size: 14px;
      letter-spacing: .04em;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    button {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px 18px;
      background: #fff;
      color: #444;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { border-color: #aaa; }
    button:focus-visible { outline: 2px solid #e60033; outline-offset: 3px; }
    button:active { background: #f7f7f7; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-live="polite">
      <div class="mark" id="mark" aria-label="早押し判定">○</div>
    </section>
    <p class="hint" id="hint">SPACEキーで早押し</p>
    <nav class="controls" aria-label="操作">
      <button id="buzzButton" type="button">BUZZ</button>
      <button id="resetButton" type="button">リセット</button>
      <button id="soundButton" type="button" aria-pressed="true">音 ON</button>
    </nav>
  </main>
  <script>
    (() => {
      const mark = document.getElementById('mark');
      const hint = document.getElementById('hint');
      const buzzButton = document.getElementById('buzzButton');
      const resetButton = document.getElementById('resetButton');
      const soundButton = document.getElementById('soundButton');
      let locked = false;
      let soundEnabled = true;
      let audioContext = null;

      function playNote(frequency, startTime, duration, volume) {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(frequency, startTime);
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.linearRampToValueAtTime(volume, startTime + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(startTime);
        oscillator.stop(startTime + duration + 0.02);
      }

      async function playChime() {
        if (!soundEnabled) return;
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          audioContext ||= new AudioContextClass();
          if (audioContext.state === 'suspended') await audioContext.resume();

          const now = audioContext.currentTime;
          // A soft, two-note descending chime: "ピン・ポーン".
          playNote(988, now, 0.18, 0.22);
          playNote(784, now + 0.19, 0.34, 0.24);
        } catch (error) {
          console.warn('音声を再生できませんでした:', error);
        }
      }

      function buzz() {
        if (locked) return;
        locked = true;
        mark.classList.add('active');
        hint.textContent = '判定済み';
        playChime();
      }

      function reset() {
        locked = false;
        mark.classList.remove('active');
        hint.textContent = 'SPACEキーで早押し';
      }

      document.addEventListener('keydown', (event) => {
        if (event.code !== 'Space' || event.repeat) return;
        const target = event.target;
        const tag = target && target.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' ||
            tag === 'BUTTON' || target?.isContentEditable) return;
        event.preventDefault();
        buzz();
      });

      buzzButton.addEventListener('click', buzz);
      resetButton.addEventListener('click', reset);
      soundButton.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundButton.textContent = soundEnabled ? '音 ON' : '音 OFF';
        soundButton.setAttribute('aria-pressed', String(soundEnabled));
      });
    })();
  </script>
</body>
</html>
